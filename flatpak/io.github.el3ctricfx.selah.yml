# flatpak/io.github.el3ctricfx.selah.yml
app-id: io.github.el3ctricfx.selah
runtime: org.gnome.Platform
runtime-version: '48'
sdk: org.gnome.Sdk
command: selah

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=home
  - --talk-name=org.freedesktop.portal.*
  - --share=network
  - --env=WEBKIT_DISABLE_DMABUF_RENDERER=1
  - --env=WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1

add-extensions:
  org.freedesktop.Platform.ffmpeg-full:
    directory: lib/ffmpeg
    version: '24.08'
    add-ld-path: .
    no-autodownload: false
    autodelete: false

modules:
  - name: patchelf
    buildsystem: simple
    build-commands:
      - ./configure --prefix=/app
      - make -j$FLATPAK_BUILDER_N_JOBS
      - make install
    sources:
      - type: archive
        path: patchelf-0.18.0.tar.bz2
        strip-components: 1

  - name: selah
    buildsystem: simple
    build-commands:
      - mkdir -p /app/lib/ffmpeg
      - ar x selah_0.1.2_amd64.deb
      - tar -xf data.tar.* -C /app
      - patchelf --set-interpreter /lib64/ld-linux-x86-64.so.2 /app/usr/bin/selah
      - patchelf --remove-rpath /app/usr/bin/selah
      - install -Dm755 /app/usr/bin/selah /app/bin/selah
      - install -Dm644 /app/usr/share/applications/selah.desktop /app/share/applications/io.github.el3ctricfx.selah.desktop
    sources:
      - type: file
        path: ../src-tauri/target/release/bundle/deb/selah_0.1.2_amd64.deb
