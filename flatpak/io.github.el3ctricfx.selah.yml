# flatpak/io.github.el3ctricfx.selah.yml
app-id: io.github.el3ctricfx.selah
runtime: org.gnome.Platform
runtime-version: '48'
sdk: org.gnome.Sdk
command: selah

finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=home
  - --talk-name=org.freedesktop.portal.*
  - --share=network
  - --env=WEBKIT_DISABLE_DMABUF_RENDERER=1
  - --env=WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1
  - --env=GDK_BACKEND=x11

add-extensions:
  org.freedesktop.Platform.ffmpeg-full:
    directory: lib/ffmpeg
    version: '24.08'
    add-ld-path: .
    no-autodownload: false
    autodelete: false

modules:
  - name: patchelf
    buildsystem: simple
    build-commands:
      - ./configure --prefix=/app
      - make -j$FLATPAK_BUILDER_N_JOBS
      - make install
    sources:
      - type: archive
        path: patchelf-0.18.0.tar.bz2
        strip-components: 1

  - name: selah
    buildsystem: simple
    build-commands:
      - mkdir -p /app/lib/ffmpeg
      - ar x Selah_0.1.8_amd64.deb
      - tar -xf data.tar.* -C /app

      # The binary inside the .deb is lowercase ("selah", from Cargo.toml's
      # package name). Keep it lowercase here so it matches what the desktop
      # file's Exec= line references — if they diverge, the launcher entry
      # silently fails to start anything.
      - patchelf --set-interpreter /lib64/ld-linux-x86-64.so.2 /app/usr/bin/selah
      - patchelf --remove-rpath /app/usr/bin/selah
      - install -Dm755 /app/usr/bin/selah /app/bin/selah

      # The .deb drops icons under /app/usr/share/icons/... but flatpak only
      # looks in /app/share/icons/... — so copy them over. We also rename
      # each one to the app-id, which is what the desktop file's Icon= field
      # will point at.
      - |
        for dir in /app/usr/share/icons/hicolor/*/apps; do
          [ -d "$dir" ] || continue
          size=$(basename "$(dirname "$dir")")
          for f in "$dir"/*.png; do
            [ -f "$f" ] || continue
            install -Dm644 "$f" "/app/share/icons/hicolor/${size}/apps/io.github.el3ctricfx.selah.png"
          done
        done

      # Tauri's generated desktop file has Exec=selah and Icon=selah. Rewrite
      # it to use the app-id for the icon (so the launcher picks it up) and
      # install it under the app-id name.
      - |
        sed -e 's|^Exec=.*|Exec=selah|' \
            -e 's|^Icon=.*|Icon=io.github.el3ctricfx.selah|' \
            /app/usr/share/applications/Selah.desktop \
            > /tmp/Selah.desktop
        install -Dm644 /tmp/Selah.desktop /app/share/applications/io.github.el3ctricfx.selah.desktop
    sources:
      - type: file
        path: ../src-tauri/target/release/bundle/deb/Selah_0.1.8_amd64.deb