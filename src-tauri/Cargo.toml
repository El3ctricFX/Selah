[package]
name = "selah"
version = "0.1.1"
description = "A local-first personal archive"
authors = ["El3ctricFX"]
edition = "2021"

[lib]
name = "selah_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-libmpv = "0.3.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trash = "5"
reqwest = { version = "0.12", features = ["rustls-tls", "stream"], default-features = false }
scraper = "0.20"
url = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util"] }
base64 = "0.22"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
