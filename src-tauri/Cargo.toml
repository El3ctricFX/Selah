[package]
name = "selah"
version = "0.1.2"
description = "A local-first personal archive"
authors = ["El3ctricFX"]
edition = "2021"

[lib]
name = "selah_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trash = "5"
reqwest = { version = "0.12", features = ["rustls-tls", "stream"], default-features = false }
scraper = "0.20"
url = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util"] }
base64 = "0.22"

# Clipboard image reading. The webview's ClipboardEvent only delivers a
# `File` on some platforms — WebKitGTK (Linux) in particular often gives us
# `text/html` for a copied image and no bytes at all. `arboard` talks to the
# OS clipboard directly so we can always retrieve the pixels regardless of
# what the webview exposes.
arboard = { version = "3", features = ["wayland-data-control"] }

# Used to re-encode the raw RGBA buffer arboard hands us into a PNG so we can
# drop it straight into the note's assets folder. We only pull in the PNG
# encoder — everything else is off to keep the binary small.
image = { version = "0.25", default-features = false, features = ["png"] }

# libmpv ships a prebuilt binary that doesn't have a macOS build. Gate it
# behind a target so the macOS job can compile the rest of the app without
# linking against it. The JS-side MpvPlayer component isn't used on macOS,
# so nothing in the UI depends on this plugin being present there.
[target.'cfg(not(target_os = "macos"))'.dependencies]
tauri-plugin-libmpv = "0.3.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
