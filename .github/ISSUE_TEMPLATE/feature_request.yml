name: Feature request
description: Suggest an improvement or a new capability for Selah.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping shape Selah. Clear use cases are especially helpful while the app is still in active development.

        Please describe the problem you want to solve rather than prescribing only one implementation. **Do not include real journal content or other private information.**

  - type: checkboxes
    id: preflight
    attributes:
      label: Before submitting
      options:
        - label: I checked existing issues and discussions for a similar idea.
          required: true
        - label: This request does not include private journal content or other sensitive information.
          required: true

  - type: dropdown
    id: area
    attributes:
      label: Which area of Selah would this improve?
      options:
        - Journaling and editor
        - Saving, files, or the .selah format
        - Images and attachments
        - Organization and navigation
        - Appearance, accessibility, or usability
        - Prayer, Scripture study, or other faith-centered workflows
        - Privacy and local-first storage
        - Performance and reliability
        - Documentation or onboarding
        - Other / multiple areas
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Explain the current limitation or the task that is harder than it should be.
      placeholder: When I use Selah to… I find it difficult to…
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What would you like to see?
      description: Describe the behavior or experience you would find useful. Examples are welcome.
      placeholder: It would help if Selah could…
    validations:
      required: true

  - type: textarea
    id: benefits
    attributes:
      label: Who would this help, and how?
      description: Share the use case or workflow this would improve.
      placeholder: This would make it easier to…

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or extra context
      description: Mention any workarounds, trade-offs, or references. Keep screenshots and examples free of personal journal data.
